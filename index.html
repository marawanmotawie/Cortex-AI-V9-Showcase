<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Institutional Briefing</title>
    <link rel="stylesheet" href="showcase.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            overflow: hidden;
            background: #000;
        }

        .viewport {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        .scene.active {
            opacity: 1;
            pointer-events: auto;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* SOLID BLACK PANEL - NO TRANSPARENCY */
        .narrative-item {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            opacity: 0;
            transition: all 0.8s cubic-bezier(0.23, 1, 0.32, 1);
            text-align: center;
            pointer-events: none;
            width: 90%;
            max-width: 950px;
            z-index: 2000;

            /* MODERN GLASSMORPHISM */
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 2px solid var(--v9-neon);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            border-radius: 12px;
            padding: 40px 60px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8), 0 0 40px rgba(168, 85, 247, 0.1);

            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            overflow: hidden;
        }

        /* Progress Pulse Line Overlay */
        .narrative-item::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            width: 100%;
            background: linear-gradient(90deg, transparent, var(--v9-neon), transparent);
            background-size: 200% 100%;
            animation: pulseGlow 2s linear infinite;
        }

        @keyframes pulseGlow {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        .narrative-item.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Removed old corner accents */

        .phase-label {
            font-family: var(--font-mono);
            font-size: 0.9rem;
            letter-spacing: 0.4em;
            color: var(--gold-primary);
            text-transform: uppercase;
            border-bottom: 2px solid rgba(212, 175, 55, 0.5);
            padding-bottom: 12px;
            margin-bottom: 5px;
        }

        .phase-text {
            font-family: var(--font-ui);
            font-size: 1.4rem;
            font-weight: 400;
            color: #f8fafc;
            line-height: 1.7;
            letter-spacing: 0.02em;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
        }

        /* Controls */
        .controls {
            position: fixed;
            bottom: 30px;
            right: 40px;
            z-index: 9999;
            /* Absolute top priority */
            display: flex;
            gap: 15px;
            pointer-events: auto;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .ctrl-btn {
            background: #000;
            border: 1px solid #444;
            color: #ccc;
            /* Improved visibility from #888 */
            padding: 12px 24px;
            border-radius: 50px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .ctrl-btn:hover {
            color: #fff;
            border-color: #fff;
        }

        .ctrl-btn.action {
            border-color: var(--gold-primary);
            color: var(--gold-primary);
        }

        .ctrl-btn.action:hover {
            background: rgba(212, 175, 55, 0.1);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }

        /* Intro */
        .intro-layer {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1s;
        }

        .intro-logo {
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: -0.05em;
            color: #fff;
            margin-bottom: 20px;
        }

        .intro-sub {
            font-family: var(--font-mono);
            color: var(--gold-primary);
            letter-spacing: 0.2em;
            font-size: 0.9rem;
            margin-bottom: 60px;
        }

        .start-trigger {
            background: transparent;
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            padding: 15px 50px;
            font-family: var(--font-mono);
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: 0.3s;
        }

        .start-trigger:hover {
            background: var(--gold-primary);
            color: #000;
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.4);
        }

        /* Progress Line */
        .progress-track {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            z-index: 3100;
            /* Highest to be on top of everything */
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .progress-bar {
            height: 100%;
            background: var(--gold-primary);
            width: 0%;
            box-shadow: 0 0 15px var(--gold-primary);
            transition: width 0.1s linear;
        }

        /* MOBILE OVERLAY STYLES */
        @media (max-width: 768px) {
            .intro-logo {
                font-size: clamp(2rem, 10vw, 3rem);
            }

            .intro-sub {
                font-size: 0.65rem;
                letter-spacing: 0.1em;
                text-align: center;
                margin-bottom: 30px;
            }

            .narrative-item {
                width: 92%;
                bottom: 90px;
                /* Lifted up to avoid collision */
                padding: 20px 15px;
                /* Tighter padding */
                gap: 15px;
            }

            .phase-text {
                font-size: clamp(0.9rem, 4vw, 1.2rem) !important;
                line-height: 1.4;
            }

            .phase-label {
                font-size: 0.7rem;
                letter-spacing: 0.2em;
            }

            .controls {
                width: 100%;
                justify-content: center;
                gap: 10px;
                right: 0;
                bottom: 25px;
            }

            .ctrl-btn {
                padding: 10px 20px;
                font-size: 0.7rem;
                flex: 0 0 auto;
                /* Prevent button crushing */
            }
        }
    </style>
</head>

<body>

    <!-- INTRO / LANGUAGE LAYER -->
    <div class="intro-layer" id="intro">
        <div class="intro-logo">CORTEX<span style="color:#fff">AI</span></div>
        <div class="intro-sub text-v9-glow">SMART TRADING SYSTEM // V9.0 MODERN</div>

        <div class="lang-select" style="display: flex; gap: 20px; margin-top: 20px;">
            <button class="start-trigger" onclick="initExperience('en')">ENGLISH</button>
            <button class="start-trigger" onclick="initExperience('ar')"
                style="font-family: 'Cairo', sans-serif;">العربية</button>
        </div>
    </div>

    <!-- VIEWPORT SCENES -->
    <div class="viewport">
        <div class="scene" id="s0"><iframe src="terminal.html" class="cinematic-zoom"></iframe></div>
        <div class="scene" id="s1"><iframe src="scanner.html" class="cinematic-zoom"></iframe></div>
        <div class="scene" id="s2"><iframe src="dashboard.html" class="cinematic-zoom"></iframe></div>
        <div class="scene" id="s3"><iframe src="archive.html" class="cinematic-zoom"></iframe></div>
    </div>

    <!-- NARRATIVE UI -->
    <div class="narrative-item" id="narrativeUi">
        <div class="phase-label" id="pLabel">SYSTEM BOOT</div>
        <div class="phase-text" id="pText"></div>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
        <button class="ctrl-btn" onclick="togglePause()" id="btnPause">PAUSE</button>
        <button class="ctrl-btn action" onclick="nextPhase()" id="btnNext">NEXT PHASE ❯</button>
    </div>

    <div class="progress-track">
        <div class="progress-bar" id="pBar"></div>
    </div>

    <script>
        // BILINGUAL DATA STORE
        const content = {
            en: {
                introSub: "SMART TRADING SYSTEM // V9.0 MODERN",
                btnPause: "PAUSE",
                btnResume: "RESUME",
                btnNext: "NEXT PHASE ❯",
                story: [
                    { id: 's0', label: 'PHASE 01 // SYSTEM CORE', text: 'Initializing the High-Frequency Trading Core. Establishing high-speed connections to global exchanges.', dur: 8000 },
                    { id: 's1', label: 'PHASE 02 // MARKET SCANNER', text: 'Scanning the entire market for "Relative Strength". Isolating coins that decouple from BTC for maximum gain.', dur: 8000 },
                    { id: 's2', label: 'PHASE 03 // EXECUTION ENGINE', text: 'Real-time decision making. AI analyzing order book depth and momentum to trigger surgical entries.', dur: 8000 },
                    { id: 's3', label: 'PHASE 04 // PERFORMANCE ARCHIVE', text: 'Reviewing the results. Consistent profitability through disciplined risk management and deep learning.', dur: 10000 }
                ]
            },
            ar: {
                introSub: "نظام التداول الذكي // إصدار 9.0 الحديث",
                btnPause: "إيقاف مؤقت",
                btnResume: "استكمال",
                btnNext: "❮ المرحلة التالية",
                story: [
                    { id: 's0', label: 'المرحلة 01 // نواة النظام', text: 'بدء تشغيل محرك التداول عالي التردد. إنشاء اتصالات فائقة السرعة مع المنصات العالمية.', dur: 8000 },
                    { id: 's1', label: 'المرحلة 02 // ماسح السوق', text: 'فحص السوق بالكامل للبحث عن "القوة النسبية". اختيار العملات المستقلة عن حركة البيتكوين لتحقيق أقصى ربح.', dur: 8000 },
                    { id: 's2', label: 'المرحلة 03 // محرك التنفيذ', text: 'اتخاذ القرار لحظياً. ذكاء اصطناعي يحلل عمق سجل الأوامر والزخم لتنفيذ صفقات جراحية دقيقة.', dur: 8000 },
                    { id: 's3', label: 'المرحلة 04 // سجل الأداء', text: 'مراجعة النتائج. أرباح مستمرة من خلال إدارة مخاطر صارمة وتقنيات تعلم عميق متطورة.', dur: 10000 }
                ]
            }
        };

        let currentLang = 'en';
        let currentIdx = 0;
        let isPaused = false;
        let timer;
        let pInterval;
        let typeInterval;
        let audioCtx;

        async function initExperience(lang) {
            currentLang = lang;

            // Setup Audio
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }
                playSfx('boot');
            } catch (e) { console.log('Audio not supported', e); }

            // Reset & Apply Language Styles
            document.body.classList.remove('rtl');
            document.getElementById('narrativeUi').classList.remove('rtl');
            document.getElementById('intro').classList.remove('rtl');

            if (lang === 'ar') {
                document.body.classList.add('rtl');
                document.getElementById('narrativeUi').classList.add('rtl');
                document.getElementById('intro').classList.add('rtl');
            }

            const labels = content[lang];
            document.getElementById('btnPause').innerText = labels.btnPause;
            document.getElementById('btnNext').innerText = labels.btnNext;
            document.querySelector('.intro-sub').innerText = labels.introSub;

            // Pass language to iframes safely (only if changed)
            document.querySelectorAll('iframe').forEach(frame => {
                let currentSrc = frame.getAttribute('src');
                let baseUrl = currentSrc.split('?')[0];
                let newSrc = baseUrl + '?lang=' + lang;

                if (currentSrc !== newSrc) {
                    frame.setAttribute('src', newSrc);
                }
            });

            // Reveal Controls
            document.querySelector('.controls').style.opacity = '1';
            document.querySelector('.progress-track').style.opacity = '1';

            // Fade Out Intro
            document.getElementById('intro').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('intro').style.display = 'none';
                runPhase(0);
            }, 1000);
        }

        function runPhase(idx) {
            const storyData = content[currentLang].story;
            if (idx >= storyData.length) idx = 0;
            currentIdx = idx;
            const data = storyData[idx];

            document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
            document.getElementById(data.id).classList.add('active');

            const ui = document.getElementById('narrativeUi');
            ui.classList.remove('visible');

            setTimeout(() => {
                document.getElementById('pLabel').innerText = data.label;
                typewriter(data.text);
                ui.classList.add('visible');
            }, 500);

            startProgress(data.dur);
            playSfx('swoosh');

            clearTimeout(timer);
            if (!isPaused) {
                timer = setTimeout(nextPhase, data.dur);
            }
        }

        function nextPhase() {
            runPhase(currentIdx + 1);
        }

        function togglePause() {
            isPaused = !isPaused;
            const btn = document.getElementById('btnPause');
            const labels = content[currentLang];

            if (isPaused) {
                btn.innerText = labels.btnResume;
                clearTimeout(timer);
                clearInterval(pInterval);
            } else {
                btn.innerText = labels.btnPause;
                runPhase(currentIdx);
            }
        }

        function startProgress(duration) {
            clearInterval(pInterval);
            const bar = document.getElementById('pBar');
            bar.style.width = '0%';
            let start = Date.now();

            pInterval = setInterval(() => {
                if (isPaused) { start += 16; return; }
                let elapsed = Date.now() - start;
                let pct = Math.min((elapsed / duration) * 100, 100);
                bar.style.width = pct + '%';
                if (pct >= 100) clearInterval(pInterval);
            }, 16);
        }

        function typewriter(txt) {
            const el = document.getElementById('pText');
            el.textContent = '';
            let buffer = '';
            clearInterval(typeInterval);

            let i = 0;
            typeInterval = setInterval(() => {
                const char = txt.charAt(i);
                buffer += char;
                el.textContent = buffer;
                if (Math.random() > 0.8) playSfx('type');
                i++;
                if (i >= txt.length) clearInterval(typeInterval);
            }, 30);
        }

        function playSfx(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'type') {
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'swoosh') {
                osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'boot') {
                osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.0);
                osc.start(); osc.stop(audioCtx.currentTime + 1.0);
            }
        }
    </script>
</body>

</html>
